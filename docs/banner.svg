<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="zotero-local-mcp">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c16"/>
      <stop offset="50%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#180e1c"/>
    </linearGradient>

    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="45%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity=".4"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity=".4"/>
    </linearGradient>

    <linearGradient id="progress-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <radialGradient id="orb-right" cx="82%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity=".22"/>
      <stop offset="55%" stop-color="#9333ea" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#070c16" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orb-left" cx="20%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".18"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#070c16" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1280" height="420" rx="32" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="32" fill="url(#orb-right)"/>
  <rect width="1280" height="420" rx="32" fill="url(#orb-left)"/>

  <!-- Ambient light orbs -->
  <circle cx="1060" cy="80" r="140" fill="#f43f5e" opacity=".12" filter="url(#soft)"/>
  <circle cx="160" cy="380" r="110" fill="#38bdf8" opacity=".14" filter="url(#soft)"/>

  <!-- Faint tech grid lines -->
  <g stroke="#94a3b8" stroke-opacity=".06" stroke-width="1">
    <path d="M80 0v420M160 0v420M240 0v420M320 0v420M400 0v420M480 0v420M560 0v420M640 0v420M720 0v420M800 0v420M880 0v420M960 0v420M1040 0v420M1120 0v420M1200 0v420"/>
    <path d="M0 70h1280M0 140h1280M0 210h1280M0 280h1280M0 350h1280"/>
  </g>

  <!-- Left Column: Branding & Info -->
  <text x="88" y="88" fill="#38bdf8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="4">ZOTERO 10 · MODEL CONTEXT PROTOCOL</text>
  
  <text x="88" y="168" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="800">zotero<tspan fill="url(#title-grad)">-local-mcp</tspan></text>
  
  <text x="88" y="218" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400">纯本地文献库与 AI 智能体原生连接器 · 零云端依赖</text>

  <!-- Capability Badges (Pills) -->
  <g font-family="ui-sans-serif, system-ui, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600">
    <!-- Pill 1: Zotero Native API -->
    <rect x="88" y="252" width="168" height="36" rx="18" fill="#180e1c" stroke="#f43f5e" stroke-opacity=".6"/>
    <circle cx="106" cy="270" r="4" fill="#f43f5e"/>
    <text x="118" y="275" fill="#fda4af">Zotero 10 原生 API</text>

    <!-- Pill 2: Zero Cloud Storage -->
    <rect x="268" y="252" width="168" height="36" rx="18" fill="#061c18" stroke="#10b981" stroke-opacity=".6"/>
    <circle cx="286" cy="270" r="4" fill="#10b981"/>
    <text x="298" y="275" fill="#6ee7b7">0 云端消耗 · 本地落盘</text>

    <!-- Pill 3: 30+ Tools -->
    <rect x="448" y="252" width="138" height="36" rx="18" fill="#0c1e33" stroke="#38bdf8" stroke-opacity=".6"/>
    <circle cx="466" cy="270" r="4" fill="#38bdf8"/>
    <text x="478" y="275" fill="#7dd3fc">30+ MCP 工具</text>

    <!-- Pill 4: CLI Dual Track -->
    <rect x="598" y="252" width="108" height="36" rx="18" fill="#1c142c" stroke="#a855f7" stroke-opacity=".6"/>
    <circle cx="616" cy="270" r="4" fill="#a855f7"/>
    <text x="628" y="275" fill="#d8b4fe">zotero-cli</text>
  </g>

  <!-- Storage Security Bar -->
  <g font-family="ui-sans-serif, system-ui, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="88" y="336" fill="#94a3b8" font-size="14" font-weight="500">
      <tspan fill="#34d399">●</tspan> 本地存储 100% 本地落盘 · 绝不消耗 300MB 云端配额 · 兼容 WebDAV
    </text>
    <rect x="88" y="352" width="580" height="12" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <rect x="88" y="352" width="580" height="12" rx="6" fill="url(#progress-bar)"/>
  </g>

  <!-- Right Column: Sleek Server Protocol Terminal Card -->
  <g transform="translate(720 50)">
    <!-- Card Container -->
    <rect width="472" height="320" rx="20" fill="#0b1322" fill-opacity=".92" stroke="url(#card-border)" stroke-width="1.5"/>
    
    <!-- Window Bar -->
    <circle cx="28" cy="26" r="5.5" fill="#ef4444" opacity=".8"/>
    <circle cx="46" cy="26" r="5.5" fill="#eab308" opacity=".8"/>
    <circle cx="64" cy="26" r="5.5" fill="#22c55e" opacity=".8"/>
    <text x="86" y="30" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">zotero-local-mcp.server</text>

    <!-- Active Badge -->
    <rect x="364" y="15" width="90" height="22" rx="11" fill="#064e3b" fill-opacity=".8" stroke="#059669" stroke-opacity=".7"/>
    <circle cx="377" cy="26" r="3.5" fill="#34d399"/>
    <text x="386" y="30" fill="#a7f3d0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">ONLINE</text>

    <!-- Divider -->
    <line x1="16" y1="48" x2="456" y2="48" stroke="#1e293b" stroke-width="1"/>

    <!-- Terminal Code / Protocol Metadata Lines -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <!-- Line 1: Host -->
      <text x="24" y="78" fill="#f43f5e" font-weight="700">ENDPOINT</text>
      <text x="108" y="78" fill="#94a3b8">http://localhost:23119/api/</text>

      <!-- Line 2: Auth -->
      <text x="24" y="104" fill="#38bdf8" font-weight="700">AUTH</text>
      <text x="108" y="104" fill="#cbd5e1">Native Handshake <tspan fill="#64748b">(0600 key)</tspan></text>

      <!-- Line 3: Storage -->
      <text x="24" y="130" fill="#34d399" font-weight="700">ATTACH</text>
      <text x="108" y="130" fill="#cbd5e1">Local storage/ <tspan fill="#34d399">(Zero Cloud Leak)</tspan></text>
      
      <!-- Line 4: Safety -->
      <text x="24" y="156" fill="#c084fc" font-weight="700">SAFETY</text>
      <text x="108" y="156" fill="#cbd5e1">Patch Trash <tspan fill="#64748b">(Reversible Deletion)</tspan></text>
    </g>

    <!-- Mini Metric Dashboard Cards (3 Columns) -->
    <g transform="translate(20 180)">
      <!-- Card 1: 30+ Tools -->
      <rect x="0" y="0" width="136" height="74" rx="12" fill="#111c30" stroke="#1e2e4a" stroke-width="1"/>
      <text x="68" y="36" text-anchor="middle" fill="#38bdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="800">30+</text>
      <text x="68" y="58" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, PingFang SC, sans-serif" font-size="12" font-weight="500">MCP 原生工具</text>

      <!-- Card 2: 0 Cloud Quota -->
      <rect x="148" y="0" width="136" height="74" rx="12" fill="#0b241d" stroke="#134e3e" stroke-width="1"/>
      <text x="216" y="36" text-anchor="middle" fill="#34d399" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="800">0 MB</text>
      <text x="216" y="58" text-anchor="middle" fill="#6ee7b7" font-family="ui-sans-serif, system-ui, PingFang SC, sans-serif" font-size="12" font-weight="500">云端配额消耗</text>

      <!-- Card 3: 100% Local -->
      <rect x="296" y="0" width="136" height="74" rx="12" fill="#201124" stroke="#48183e" stroke-width="1"/>
      <text x="364" y="36" text-anchor="middle" fill="#f43f5e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="800">100%</text>
      <text x="364" y="58" text-anchor="middle" fill="#fda4af" font-family="ui-sans-serif, system-ui, PingFang SC, sans-serif" font-size="12" font-weight="500">数据隐私落盘</text>
    </g>

    <!-- Footer Supported Clients -->
    <g transform="translate(24 292)" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12">
      <text fill="#64748b" font-weight="500">适配智能体：</text>
      <text x="76" fill="#cbd5e1" font-weight="600">Claude Desktop  ·  Cursor  ·  Oh My Pi (OMP)  ·  Windsurf</text>
    </g>
  </g>
</svg>
